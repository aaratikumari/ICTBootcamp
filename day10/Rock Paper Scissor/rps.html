<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
</head>
<body>

    <h1>Rock Paper Seasor</h1>

    <button onclick="
    user = 'rock';
    computer = options[Math.floor(Math.random()*3)];
    if (user=='computer') {
        Result = 'Draw';
    }
    else if (computer=='Paper') {
        Result = 'You Loose';
    }
    else if (computer=='Scissor'){
        Result = 'You Win';
    }
    document.getElementById('user').innerHTML = 'You : ' + user;
    document.getElementById('computer').innerHTML = 'computer : ' + computer;
    document.getElementById('Result').innerHTML = 'Result : ' + Result;
    ">Rock   </button>
    
    <button onclick="
    user = 'Paper';
    computer = options[Math.floor(Math.random()*3)];
    if (user=='computer') {
        Result = 'Draw';
    }
    else if (computer=='rock') {
        Result = 'You Win';
    }
    else if (computer=='Scissor'){
        Result = 'You Loose';
    }
    document.getElementById('user').innerHTML = 'You : ' + user;
    document.getElementById('computer').innerHTML = 'Computer : ' + computer;
    document.getElementById('Result').innerHTML = 'Result : ' + Result;
    ">Paper  </button>


    <button onclick="
    user = 'Scissor';
    computer = options[Math.floor(Math.random()*3)];
    if (user=='computer') {
        Result = 'Draw';
    }
    else if (computer=='rock') {
        Result = 'You Loose';
    }
    else if (computer=='Paper') {
        Result = 'You WIN';
    }
    document.getElementById('user').innerHTML = 'You : ' + user;
    document.getElementById('computer').innerHTML = 'Computer : ' + computer;
    document.getElementById('Result').innerHTML = 'Result : ' + Result;
    ">Scissor</button>

    <h3 id="user"></h3>
    <h3 id="computer"></h3>
    <h2 id="Result"></h2>

    <script>
        var options = ['rock', 'paper', 'Scissor'];
        var user;
        var computer;
        var Result;
    </script>
    
</body>
</html>
