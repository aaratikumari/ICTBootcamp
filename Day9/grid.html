<!DOCTYPE html>
<html lang="en">
<head> 
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto;
            background-color: rgb(1, 1, 15);
            padding: 10px;
            gap: 5px;
        }
        .container div {
            background-color: rgb(243, 153, 93);
            padding: 10px;
            font-size: 30px;
            text-align: center;    
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
</head>
<body>
    <div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    


</body>
</html>
