<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
     <h1>Table of Students Marks</h1>
     <table border="1 ">

         </tr>

            <td>Lisa</td>

            <td>97</td>
        </tr>
        <tr>
            <td>Kaira</td>
            <td>87</td>
            <td>92</td>
            <td>95</td>
        </tr>
        <tr>
            <td>Puja</td>
            <td>88</td>
            <td>93</td>
            <td>96</td>
        </tr>
        <tr>
            <td>Anisha</td>
            <td>89</td>
            <td>95</td>
            <td>97</td>
        </tr>   
     </table>
    <h1>Table of Employee Details</h1>
    <table border="1">
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>101</td>
            <td>John Doe</td>
            <td>HR</td>
            <td>$50,000</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Jane Smith</td>
            <td>Finance</td>
            <td>$60,000</td>
        </tr>
    </table>

</body>
</html>
