<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
     <h1>Ordered list of Items requried to make Tea</h1>
     <ol type="i">
        <li>Milk</li>
        <li>sugar</li>
        <li>Tea Leaves</li>
        <li>Water</li>
     </ol>
     
     <h2>Unordered List of Parts of Computer</h2>
     <ul style="list-style-type: square;">
         <li>CPU</li>
         <li>RAM</li>
         <li>Storage</li>
         <li>Power Supply</li>
     </ul>
</body>
</html>
